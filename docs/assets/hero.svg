<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Allure ERP. Manufacturing, with a record of every batch.</title>
  <desc id="desc">Private manufacturing product preview. Materials, production batches, quality release and traceability. Fictional examples.</desc>
  <rect width="1200" height="390" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="45" y="40" width="44" height="44" rx="10" fill="#1d1d1f"/>
    <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="m67 49 13 7-13 7-13-7 13-7Z"/><path d="m54 62 13 7 13-7m-26 6 13 7 13-7"/></g>
    <text x="104" y="71" fill="#1d1d1f" font-size="31" font-weight="600" letter-spacing="-1">allure</text><text x="195" y="70" fill="#6e6e73" font-size="14">ERP</text>
    <text x="45" y="155" fill="#1d1d1f" font-size="45" font-weight="600" letter-spacing="-1.4">Manufacturing, with a record</text>
    <text x="45" y="210" fill="#1d1d1f" font-size="45" font-weight="600" letter-spacing="-1.4">of every batch.</text>
    <text x="47" y="250" fill="#6e6e73" font-size="18">Plan production. Inspect quality. Release with evidence.</text>
    <text x="47" y="341" fill="#6e6e73" font-size="13">Configurable manufacturing workspace · Private preview</text>
    <g transform="translate(815 46)">
      <rect width="335" height="290" rx="19" fill="#fff" stroke="#e5e5ea"/>
      <text x="22" y="35" fill="#6e6e73" font-size="12">BATCH-101</text><text x="22" y="66" fill="#1d1d1f" font-size="18" font-weight="600">Hair Shampoo (Moisturising)</text>
      <text x="22" y="91" fill="#6e6e73" font-size="13">960 units recorded / 1,000 planned</text>
      <path d="M23 112h289" stroke="#e5e5ea"/>
      <circle cx="30" cy="141" r="10" fill="#eaf6ee"/><text x="26" y="145" fill="#237b4b" font-size="12">✓</text><text x="50" y="145" fill="#414147" font-size="13">Source lots recorded</text>
      <circle cx="30" cy="178" r="10" fill="#eaf6ee"/><text x="26" y="182" fill="#237b4b" font-size="12">✓</text><text x="50" y="182" fill="#414147" font-size="13">Production output recorded</text>
      <circle cx="30" cy="215" r="10" fill="#fff5df"/><text x="28" y="219" fill="#8a5900" font-size="12">!</text><text x="50" y="219" fill="#414147" font-size="13">Quality retest required</text>
      <rect x="21" y="243" width="292" height="28" rx="5" fill="#fff5df"/><text x="34" y="262" fill="#8a5900" font-size="12">Hold blocks finished-stock release</text>
    </g>
  </g>
</svg>
