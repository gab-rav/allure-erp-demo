<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">How a manufacturing batch moves through Allure ERP</title>
  <desc id="desc">Plan a batch, issue released unexpired material lots, record production output, inspect quality, explicitly release, then dispatch. Failed or missing checks hold the batch for review and retest. Only released stock can ship.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#adb6c2"/></marker><marker id="hold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#ae822d"/></marker></defs>
  <rect width="1200" height="350" rx="12" fill="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="38" y="43" font-size="22" font-weight="600" fill="#1d1d1f">A batch moves forward only when its controls pass.</text>
    <text x="38" y="69" font-size="13" fill="#6e6e73">Manufacturing workflow · The private preview implements each step below</text>
    <g fill="none" stroke="#adb6c2" stroke-width="2" marker-end="url(#arrow)"><path d="M200 153h27"/><path d="M390 153h27"/><path d="M580 153h27"/><path d="M770 153h27"/><path d="M960 153h27"/></g>
    <g transform="translate(38 108)"><rect width="162" height="91" rx="8" fill="#f5f5f7"/><text x="16" y="28" font-size="16" font-weight="600" fill="#1d1d1f">1. Plan batch</text><text x="16" y="52" font-size="12" fill="#6e6e73">Product + recipe</text><text x="16" y="71" font-size="12" fill="#6e6e73">Target output</text></g>
    <g transform="translate(228 108)"><rect width="162" height="91" rx="8" fill="#f5f5f7"/><text x="16" y="28" font-size="16" font-weight="600" fill="#1d1d1f">2. Issue lots</text><text x="16" y="52" font-size="12" fill="#6e6e73">Released + unexpired</text><text x="16" y="71" font-size="12" fill="#6e6e73">Trace every input</text></g>
    <g transform="translate(418 108)"><rect width="162" height="91" rx="8" fill="#f5f5f7"/><text x="16" y="28" font-size="16" font-weight="600" fill="#1d1d1f">3. Produce</text><text x="16" y="52" font-size="12" fill="#6e6e73">Actual output</text><text x="16" y="71" font-size="12" fill="#6e6e73">Yield + deviations</text></g>
    <g transform="translate(608 108)"><rect width="162" height="91" rx="8" fill="#fff5df"/><text x="16" y="28" font-size="16" font-weight="600" fill="#8a5900">4. Inspect</text><text x="16" y="52" font-size="12" fill="#8a5900">Evidence + inspector</text><text x="16" y="71" font-size="12" fill="#8a5900">All checks pass?</text></g>
    <g transform="translate(798 108)"><rect width="162" height="91" rx="8" fill="#eaf6ee"/><text x="16" y="28" font-size="16" font-weight="600" fill="#237b4b">5. Release</text><text x="16" y="52" font-size="12" fill="#237b4b">Explicit review</text><text x="16" y="71" font-size="12" fill="#237b4b">Stock becomes available</text></g>
    <g transform="translate(988 108)"><rect width="174" height="91" rx="8" fill="#f5f5f7"/><text x="16" y="28" font-size="16" font-weight="600" fill="#1d1d1f">6. Dispatch</text><text x="16" y="52" font-size="12" fill="#6e6e73">Released quantity only</text><text x="16" y="71" font-size="12" fill="#6e6e73">Batch → shipment link</text></g>
    <path d="M688 199v31" fill="none" stroke="#ae822d" stroke-width="2" marker-end="url(#hold-arrow)"/>
    <rect x="500" y="234" width="377" height="48" rx="7" fill="#fff8eb" stroke="#e9d3ad"/>
    <text x="518" y="254" font-size="12" font-weight="600" fill="#8a5900">Failed or missing check → quality hold</text><text x="518" y="272" font-size="11" fill="#8a5900">Investigate and retest. Retain the earlier result.</text>
    <path d="M877 257h35v-37H753v-19" fill="none" stroke="#ae822d" stroke-width="1.5" marker-end="url(#hold-arrow)"/>
    <text x="38" y="321" font-size="12" fill="#6e6e73">Material lots → batch allocations → inspection history → release decision → dispatched units</text>
  </g>
</svg>
