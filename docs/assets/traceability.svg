<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Material-to-shipment traceability</title><desc id="desc">Three material lots feed BATCH-101. Its inspection history and release reviewer stay linked to the batch. After passing checks and release, a dispatch links the batch to its customer order. The diagram shows a completed walkthrough with synthetic data.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#adb6c2"/></marker></defs>
  <rect width="1100" height="380" rx="12" fill="#f5f5f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="35" y="43" font-size="23" font-weight="600" fill="#1d1d1f">Trace the finished batch back to its inputs.</text><text x="35" y="69" font-size="12" fill="#6e6e73">Illustrative completed walkthrough · Synthetic data</text>
    <g fill="none" stroke="#adb6c2" stroke-width="2" marker-end="url(#a)"><path d="M260 127h55v70h55"/><path d="M260 201h110"/><path d="M260 275h55v-70h55"/><path d="M635 201h70"/><path d="M880 201h35"/></g>
    <g fill="#fff" stroke="#e5e5ea"><rect x="35" y="98" width="225" height="58" rx="7"/><rect x="35" y="172" width="225" height="58" rx="7"/><rect x="35" y="246" width="225" height="58" rx="7"/></g>
    <g fill="#1d1d1f" font-size="13" font-weight="600"><text x="51" y="121">Moisturising shampoo bulk</text><text x="51" y="195">500 g bottle + pump</text><text x="51" y="269">Moisturising shampoo labels</text></g>
    <g fill="#6e6e73" font-size="11"><text x="51" y="142">SHAM-BULK-260915 · 500 kg</text><text x="51" y="216">PUMP-500-260901 · 1,000 pieces</text><text x="51" y="290">LBL-SHAM-260910 · 1,000 labels</text></g>
    <rect x="370" y="106" width="265" height="190" rx="10" fill="#1d1d1f"/><text x="391" y="138" font-size="20" fill="#fff" font-weight="600">BATCH-101</text><text x="391" y="166" font-size="13" fill="#eeeef2">Moisturising shampoo · 960 units</text><path d="M391 185h223" stroke="#62626a"/><text x="391" y="211" font-size="12" fill="#eeeef2">Input lots and quantities</text><text x="391" y="236" font-size="12" fill="#eeeef2">Inspection + retest history</text><text x="391" y="261" font-size="12" fill="#eeeef2">Release decision + reviewer</text>
    <rect x="705" y="156" width="175" height="90" rx="8" fill="#eaf6ee"/><text x="723" y="185" font-size="15" fill="#237b4b" font-weight="600">Released stock</text><text x="723" y="211" font-size="12" fill="#237b4b">Only after all checks</text><text x="723" y="229" font-size="12" fill="#237b4b">and explicit review</text>
    <rect x="915" y="156" width="150" height="90" rx="8" fill="#fff" stroke="#e5e5ea"/><text x="931" y="185" font-size="15" fill="#1d1d1f" font-weight="600">Dispatch</text><text x="931" y="211" font-size="12" fill="#6e6e73">Batch + order</text><text x="931" y="229" font-size="12" fill="#6e6e73">Actual quantity</text>
    <text x="35" y="347" font-size="12" fill="#6e6e73">Start from a material lot to find affected batches. Start from a shipment to find its batch and input lots.</text>
  </g>
</svg>
